name: mmqa_home
dataset: mmqa
answer_style: short
corpus: {scope: full}
calibration: mmqa
questions:
  split: dev
  quotas: {single: 100, table: 40, compose: 120, intersect: 20, compare: 20}
  calib_split: train
  calib_n: 100
  seed: 13
partition: {method: single, parts: 1, seed: 13}
sites:
  - name: home
    machine: aurora
    domain: alcf
    policy: snippets
    collections:
      - {name: all, modality: text, encoder: bge-base, source: "text:*,table:*,image:*"}
