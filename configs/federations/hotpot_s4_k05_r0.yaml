name: hotpot_s4_k05_r0
dataset: hotpotqa
answer_style: short
calibration: musique
questions:
  n: 300
  calib_n: 100
  seed: 13
partition:
  method: dirichlet
  parts: 3
  seed: 13
  shard_seed: 0
  beta: 0.5
  clusters: 8
sites:
- name: aurora_0
  machine: aurora_0
  domain: alcf
  policy: snippets
  max_concurrency: 32
  collections:
  - name: text
    modality: text
    encoder: bge-base
    source: text:0,text:2
    shard: 0/2
    vectors_from: hotpot_fed/aurora/text
- name: aurora_1
  machine: aurora_1
  domain: alcf
  policy: snippets
  max_concurrency: 32
  collections:
  - name: text
    modality: text
    encoder: bge-base
    source: text:0,text:2
    shard: 1/2
    vectors_from: hotpot_fed/aurora/text
- name: midway3_0
  machine: midway3_0
  domain: midway3
  policy: snippets
  max_concurrency: 32
  collections:
  - name: text
    modality: text
    encoder: e5-base
    source: text:1
    shard: 0/2
    vectors_from: hotpot_fed/midway3/text
- name: midway3_1
  machine: midway3_1
  domain: midway3
  policy: snippets
  max_concurrency: 32
  collections:
  - name: text
    modality: text
    encoder: e5-base
    source: text:1
    shard: 1/2
    vectors_from: hotpot_fed/midway3/text
