name: musique_s2_r0_n1
dataset: musique
answer_style: short
calibration: musique
corpus:
  paragraphs_of: final_test
questions:
  split: hipporag
  n: 300
  calib_split: train
  calib_n: 100
  seed: 13
partition:
  method: by_title
  parts: 3
  seed: 13
sites:
- name: aurora_0
  machine: aurora_0
  domain: alcf
  policy: snippets
  max_concurrency: 32
  data_from: musique_next/aurora
  collections:
  - name: text
    modality: text
    encoder: bge-base
    source: text:0,text:2
    vectors_from: musique_next_home/home/all
- name: midway3_0
  machine: midway3_0
  domain: midway3
  policy: snippets
  max_concurrency: 32
  data_from: musique_next/midway3
  collections:
  - name: text
    modality: text
    encoder: e5-base
    source: text:1
