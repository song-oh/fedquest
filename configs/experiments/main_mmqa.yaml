name: main_mmqa
federation: mmqa_s4_k05_r0
split: full
limit: 2441
workload: cold
concurrency: 64
require_calibration: true
interleave: true
stage: 1
lane: gemma
after: ['tool:route']
env: {FEDQUEST_RECORD_WIRE: $FEDQUEST_RUNS/cache/wire_main_mmqa.sqlite}
methods:
  - {method: fedquest, label: fedquest, preset: final, params: {calibration: mmqa_v4e, scores: anchor, zcal: mmqa_z, views: true, total_budget: 16000, route: vocab+proto}}
  - {method: ircot_mm_b, label: ircot_t4@16k, params: {top: 4, k: 4, total_budget: 16000}}
  - {method: ircot_mm_b, label: ircot_t8@16k, params: {top: 8, k: 8, total_budget: 16000}}
  - {method: react, label: react@16k, params: {total_budget: 16000}}
  - {method: rewoo, label: rewoo@16k, params: {total_budget: 16000}}
  - {method: mgrag_fu, label: mgrag_fu@16k, preset: fu_alt, params: {probe: semijoin, limits: share, mention: 2, ties: salted, calibration: mmqa_v4, total_budget: 16000, answer_images: true}}
  - {method: llm_planner_ops, label: react_ops@16k, preset: ops, params: {max_steps: 16, views: true, total_budget: 16000, tokens: null}}
  - {method: mgrag, label: mgrag_fed@8, preset: mgrag, params: {budget: 8, answer_images: true}}
  - {method: vanilla_rag, label: vanilla_rag@8, params: {order: relevance, budget: 8}}
  - {method: closed_book}
  - {method: iter_rag_mm, label: ircot@8x8, preset: ircot, params: {order: relevance, budget: null, hops: 8, top: 8, k: 8, max_paragraphs: 48, images: 4, image_px: 512}}
